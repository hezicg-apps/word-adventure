<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Adventure</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=5">
    <link rel="apple-touch-icon" href="favicon.png?v=5">
    <link rel="manifest" href="manifest.json?v=5">
    <meta name="theme-color" content="#1e293b">

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/style.css?v=5">

    <style>
        /* גופן גלובלי נעול */
        * { font-family: 'Fredoka', 'Assistant', sans-serif !important; }
        
        body { transition: background-color 0.3s; color: #1d4ed8; overflow-x: hidden; }

        /* מסך פתיחה - עיגולים זוהרים בריווח */
        #new-splash-v5 {
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: 99999;
        }
        .glow-dot { 
            width: 18px; height: 18px; border-radius: 50%; 
            animation: glow-pulse 1.5s infinite ease-in-out;
        }
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); box-shadow: 0 0 5px rgba(255,255,255,0.1); }
            50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 15px currentColor; }
        }

        /* --- תיקון חיווי תשובות (טקסט לבן חובה) --- */
        .correct-ans { 
            background-color: #22c55e !important; 
            color: #ffffff !important; /* לבן על ירוק */
            border-color: #16a34a !important; 
            transform: scale(1.02);
            transition: all 0.2s ease;
        }
        .wrong-ans { 
            background-color: #ef4444 !important; 
            color: #ffffff !important; /* לבן על אדום */
            border-color: #dc2626 !important; 
            transition: all 0.2s ease;
        }

        /* צבע שאלות ותשובות רגיל במצב יום - תכלת עמוק */
        .text-gray-800, .text-gray-700, #wordInput, .text-blue-main { color: #1d4ed8 !important; }
        button.py-4.border-2 { color: #1d4ed8 !important; border-color: #bfdbfe !important; }

        /* כפתורי "יודע/לא יודע" ביחידות הלימוד - טקסט לבן תמיד */
        .bg-green-500, .bg-red-500, .bg-green-600, .bg-red-600 {
            color: #ffffff !important;
        }

        /* מצב לילה */
        .night-mode { background-color: #1e293b !important; color: #f1f5f9 !important; }
        .night-mode .bg-white, .night-mode .welcome-card, .night-mode .card-front, .night-mode #wordInput { 
            background-color: #334155 !important; color: #f1f5f9 !important; border-color: #475569 !important;
        }
        .night-mode button.py-4.border-2 { 
            background-color: #475569 !important; 
            color: #f1f5f9 !important; 
            border-color: #64748b !important; 
        }
        /* וידוא טקסט לבן במצב לילה לתשובות */
        .night-mode .correct-ans, .night-mode .wrong-ans { color: #ffffff !important; }

        .night-mode h1 { color: #fbbf24 !important; }

        /* משחק הזיכרון */
        .border-green-500 { border-color: #4ade80 !important; border-width: 5px !important; }
        .bg-green-50 { background-color: #f0fdf4 !important; }
        .night-mode .bg-green-50 { background-color: #064e3b !important; }

        #shareBtnElement { min-width: 180px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; }
    </style>
</head>
<body class="bg-blue-50 min-h-screen">
    
    <div id="new-splash-v5">
        <img src="favicon.png" alt="Logo" class="w-64 h-64 mb-12 animate-pulse object-contain"> 
        <div class="flex gap-8 mb-8">
            <div class="glow-dot text-blue-500 bg-blue-500"></div>
            <div class="glow-dot text-purple-500 bg-purple-500" style="animation-delay: 0.3s"></div>
            <div class="glow-dot text-pink-500 bg-pink-500" style="animation-delay: 0.6s"></div>
        </div>
        <h2 class="text-2xl font-bold text-yellow-500 tracking-widest">LOADING ADVENTURE</h2>
    </div>

    <header class="w-full max-w-2xl mx-auto px-4 py-4 relative z-10">
        <div class="grid grid-cols-3 items-center w-full">
            <div class="flex justify-start">
                <button id="toggleNight" class="text-3xl bg-transparent border-none cursor-pointer p-2">☀️</button>
            </div>
            <div class="flex justify-center">
                <h1 class="text-xl sm:text-3xl font-black text-yellow-500 tracking-tight whitespace-nowrap drop-shadow-sm">Word Adventure</h1>
            </div>
            <div class="flex justify-end">
                <img src="favicon.png?v=5" alt="Logo" class="h-12 w-auto cursor-pointer active:scale-90 transition-transform" onclick="resetAllData()">
            </div>
        </div>
    </header>

    <main id="app" class="container mx-auto px-4 pb-10 max-w-2xl flex flex-col items-center relative z-10"></main>

    <script src="js/main.js?v=5"></script>

    <script>
        // הסרת מסך פתיחה
        window.addEventListener('load', () => {
            const splash = document.getElementById('new-splash-v5');
            if(splash) {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    splash.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => splash.remove(), 500);
                }, 1000);
            }
        });

        const toggleBtn = document.getElementById('toggleNight');
        if(toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                if (typeof state !== 'undefined') {
                    state.nightMode = !state.nightMode;
                    localStorage.setItem('theme', state.nightMode ? 'night' : 'day');
                    render(); 
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'night' && typeof state !== 'undefined') {
                state.nightMode = true;
                render();
            }
        });
    </script>
</body>
</html>
