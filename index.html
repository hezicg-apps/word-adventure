<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Adventure</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Fredoka', sans-serif !important; }
        body { background-color: #eff6ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; margin: 0; }
        #app { width: 100%; max-width: 450px; }

        /* --- תיקון כרטיסיות (Flashcards) --- */
        .perspective-1000 { perspective: 1000px; }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            text-align: center; transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex;
            align-items: center; justify-content: center;
            border-radius: 2.5rem; border: 4px solid #bfdbfe;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .card-back { transform: rotateY(180deg); background-color: #2563eb; color: white; border-color: #1d4ed8; }
        .card-front { background-color: white; }

        /* --- תיקון 4 בשורה (Connect 4) --- */
        .c4-container { background: #1e40af; padding: 12px; border-radius: 1.5rem; width: fit-content; margin: 0 auto; }
        .c4-board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .c4-slot { width: 45px; height: 45px; background: #1e3a8a; border-radius: 50%; position: relative; box-shadow: inset 0 4px 6px rgba(0,0,0,0.3); }
        .token-fixed { width: 90%; height: 90%; border-radius: 50%; position: absolute; top: 5%; left: 5%; }
        .token-red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #b91c1c); }
        .token-yellow { background: radial-gradient(circle at 30% 30%, #fbbf24, #d97706); }
        .arrows-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 8px; }

        /* --- מצב לילה --- */
        .night-mode { background-color: #1e293b !important; color: #f1f5f9 !important; }
        .night-mode .bg-white, .night-mode .card-front, .night-mode .welcome-card { 
            background-color: #334155 !important; color: white !important; border-color: #475569 !important; 
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header class="w-full max-w-md flex justify-between items-center p-6">
        <button id="toggleNight" class="text-3xl">☀️</button>
        <h1 class="text-2xl font-black text-blue-600">Word Adventure</h1>
        <div class="w-10"></div>
    </header>

    <main id="app" class="px-4"></main>

    <script src="js/main.js"></script>
    <script>
        // כפתור מצב לילה
        document.getElementById('toggleNight').onclick = () => {
            state.nightMode = !state.nightMode;
            render();
        };
    </script>
</body>
</html>
