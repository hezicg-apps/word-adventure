<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Word Adventure</title>

    <meta property="og:title" content="Word Adventure">
    <meta property="og:description" content="לומדים אנגלית בכיף עם משחקים וכרטיסיות! 🚀">
    <meta property="og:image" content="https://hezicg-apps.github.io/word-adventure/logo.png">
    <meta property="og:url" content="https://hezicg-apps.github.io/word-adventure/">
    <meta property="og:type" content="website">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* מבטיח שהכותרת תמיד תהיה בראש הדף */
        #main-header {

<body class="bg-blue-50 transition-colors duration-500 min-h-screen flex flex-col">

            </button>
        </div>

        <div id="header-title-container" class="flex-grow text-center">

                Word Adventure
            </h1>
        </div>

        <div id="header-logo-container" class="w-12 flex justify-end">
            </div>
    </header>

    <main id="app" class="flex-grow flex flex-col items-center justify-start p-4 w-full max-w-4xl mx-auto">
        </main>

    <script src="js/main.js"></script>
