<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f4f8; min-height: 100vh; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; position: relative; width: 100%; height: 100%; }
        .card-flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .card-back { transform: rotateY(180deg); }
        .perspective-1000 { perspective: 1000px; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">
    <header class="w-full max-w-md flex justify-between items-center mb-8">
        <button id="toggleNight" class="text-2xl">☀️</button>
        <h1 class="text-2xl font-black text-blue-600">Word Adventure</h1>
        <div class="w-8"></div>
    </header>
    
    <div id="app" class="w-full flex flex-col items-center"></div>

    <script src="js/main.js"></script>
</body>
</html>
