<style>
    /* סורק Knight Rider */
    .scanner-container {
        width: 200px;
        height: 10px;
        background: #111;
        border: 2px solid #333;
        border-radius: 5px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }
    .scanner-bar {
        width: 40px;
        height: 100%;
        background: linear-gradient(90deg, rgba(255,0,0,0) 0%, rgba(255,0,0,1) 50%, rgba(255,0,0,0) 100%);
        position: absolute;
        box-shadow: 0 0 15px 5px rgba(255, 0, 0, 0.8);
        animation: scan 1.5s infinite ease-in-out;
    }
    @keyframes scan {
        0% { left: -40px; }
        50% { left: 200px; }
        100% { left: -40px; }
    }
</style>

<div id="splash-screen" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-black transition-opacity duration-1000">
    <img src="favicon.png" alt="Logo" class="w-80 h-80 mb-12 animate-pulse object-contain opacity-90"> 
    <h2 class="text-4xl font-black text-red-600 mb-8 tracking-widest eng-text">SCANNING SYSTEM...</h2>
    <div class="scanner-container">
        <div class="scanner-bar"></div>
    </div>
</div>
