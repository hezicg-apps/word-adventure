<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Adventure</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=3">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* גופן גלובלי נעול - Fredoka לילדים */
        * { font-family: 'Fredoka', 'Assistant', sans-serif !important; }
        
        body { transition: background-color 0.3s; color: #1d4ed8; }

        /* מסך פתיחה קלאסי ומהיר */
        #splash-screen {
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        /* צבע שאלות ותשובות במצב יום - תכלת עמוק (במקום שחור) */
        .text-gray-800, .text-gray-700, #wordInput, .text-blue-main {
            color: #1d4ed8 !important; 
        }

        /* כפתורי תשובות במבחן - טקסט תכלת במצב יום */
        button.py-4.border-2 {
            color: #1d4ed8 !important;
            border-color: #bfdbfe !important;
        }

        /* כפתורי יודע/לא יודע - טקסט לבן חובה */
        .bg-green-500, .bg-red-500, .bg-green-600, .bg-red-600, .correct-ans, .wrong-ans {
            color: #ffffff !important;
        }

        /* --- מצב לילה תכלת-נייבי רך --- */
        .night-mode { 
            background-color: #1e293b !important; 
            color: #f1f5f9 !important; 
        }

        .night-mode .bg-white, 
        .night-mode .welcome-card,
        .night-mode .card-front,
        .night-mode #wordInput,
        .night-mode .bg-blue-50 { 
            background-color: #334155 !important; 
            color: #f1f5f9 !important; 
            border-color: #475569 !important;
        }

        /* כפתורי התשובות במבחן במצב לילה */
        .night-mode button.py-4.border-2 {
            background-color: #475569 !important;
            color: #f1f5f9 !important;
            border-color: #64748b !important;
        }

        /* כפתור "חזרה לתפריט" במצב לילה */
        .night-mode .bg-gray-200 { 
            background-color: #94a3b8 !important; 
            color: #0f172a !important; 
        }

        /* כותרות */
        .night-mode h1, .night-mode .text-blue-600, .night-mode .text-blue-700 { color: #fbbf24 !important; }
        
        /* משחק הזיכרון - מסגרת ירוקה בולטת */
        .border-green-500 { border-color: #4ade80 !important; border-width: 5px !important; }
        .bg-green-50 { background-color: #f0fdf4 !important; }
        .night-mode .bg-green-50 { background-color: #064e3b !important; }

        #shareBtnElement { min-width: 180px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; }
    </style>
</head>
<body class="bg-blue-50 min-h-screen">
    
    <div id="splash-screen">
        <img src="favicon.png" alt="Logo" class="w-64 h-64 mb-8 animate-pulse object-contain"> 
        <h2 class="text-3xl font-black text-yellow-500">Word Adventure</h2>
    </div>

    <header class="w-full max-w-2xl mx-auto px-4 py-4 relative z-10">
        <div class="grid grid-cols-3 items-center w-full">
            <div class="flex justify-start">
                <button id="toggleNight" class="text-3xl bg-transparent border-none cursor-pointer p-2">☀️</button>
            </div>
            <div class="flex justify-center">
                <h1 class="text-xl sm:text-3xl font-black text-yellow-500 tracking-tight whitespace-nowrap drop-shadow-sm">Word Adventure</h1>
            </div>
            <div class="flex justify-end">
                <img src="favicon.png?v=3" alt="Logo" class="h-12 w-auto cursor-pointer active:scale-90 transition-transform" onclick="resetAllData()">
            </div>
        </div>
    </header>

    <main id="app" class="container mx-auto px-4 pb-10 max-w-2xl flex flex-col items-center relative z-10"></main>

    <script src="js/main.js"></script>

    <script>
        // הסרת מסך פתיחה מהירה (0.8 שניות)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 500);
                }
            }, 800); 
        });

        // כפתור מצב לילה
        const toggleBtn = document.getElementById('toggleNight');
        if(toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                if (typeof state !== 'undefined') {
                    state.nightMode = !state.nightMode;
                    localStorage.setItem('theme', state.nightMode ? 'night' : 'day');
                    render(); 
                }
            });
        }

        // טעינה ראשונית - הגדרת ערכת נושא
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'night' && typeof state !== 'undefined') {
                state.nightMode = true;
                render();
            }
        });
    </script>
</body>
</html>
