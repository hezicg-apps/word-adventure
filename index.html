<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Learning Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="icon" type="image/png" href="favicon.png?v=3">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        .dot { animation: glow 1.5s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.5s; }
        .dot:nth-child(3) { animation-delay: 1s; }
        @keyframes glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        
        body { transition: background-color 0.3s, color 0.3s; }
        
        /* --- מצב לילה --- */
        .night-mode { background-color: #0f172a !important; color: #f8fafc !important; }
        .night-mode .bg-white, 
        .night-mode .welcome-card,
        .night-mode .card-front,
        .night-mode #wordInput { 
            background-color: #1e293b !important; 
            color: #f8fafc !important; 
            border-color: #334155 !important;
        }
        .night-mode .text-gray-800, .night-mode .text-gray-700 { color: #cbd5e1 !important; }
        .night-mode h1, .night-mode .text-blue-600 { color: #fbbf24 !important; }

        /* תיקון משחק הזיכרון - מסגרת ירוקה שחזקה ממצב לילה */
        .border-green-500 { border-color: #22c55e !important; border-width: 4px !important; }
        .bg-green-50 { background-color: #f0fdf4 !important; }
        .night-mode .bg-green-50 { background-color: #064e3b !important; }

        /* תיקון כפתור השיתוף */
        #shareBtnElement {
            min-width: fit-content;
            white-space: normal;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            line-height: 1.2;
            padding: 8px 16px;
        }

        .eng-text { font-family: sans-serif; }
    </style>
</head>
<body class="bg-blue-50 text-gray-800 min-h-screen">
    
    <div id="splash-screen" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-slate-900 transition-opacity duration-1000">
        <img src="favicon.png" alt="Logo" class="w-48 h-48 mb-8 animate-pulse"> 
        <h2 class="text-4xl font-black text-yellow-500 mb-10">Word Adventure</h2>
        <div class="flex gap-4">
            <div class="dot w-4 h-4 rounded-full bg-blue-500 shadow-[0_0_15px_#3b82f6]"></div>
            <div class="dot w-4 h-4 rounded-full bg-purple-500 shadow-[0_0_15px_#a855f7]"></div>
            <div class="dot w-4 h-4 rounded-full bg-blue-400 shadow-[0_0_15px_#60a5fa]"></div>
        </div>
    </div>

    <header class="w-full max-w-2xl mx-auto px-4 py-4">
        <div class="grid grid-cols-3 items-center w-full">
            <div class="flex justify-start">
                <button id="toggleNight" class="text-3xl bg-transparent border-none cursor-pointer p-2">☀️</button>
            </div>
            <div class="flex justify-center">
                <h1 class="text-2xl sm:text-3xl font-black text-yellow-500 tracking-tight whitespace-nowrap drop-shadow-sm">Word Adventure</h1>
            </div>
            <div class="flex justify-end">
                <img src="favicon.png?v=3" alt="Logo" class="h-12 w-auto object-contain cursor-pointer active:scale-90 transition-transform" onclick="resetAllData()">
            </div>
        </div>
    </header>

    <div id="app" class="container mx-auto px-4 pb-10 max-w-2xl flex flex-col items-center"></div>

    <script src="js/main.js"></script>

    <script>
        // מסך פתיחה - מקוצר ל-1.2 שניות
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 1000);
                }
            }, 1200); 
        });

        // לוגיקה למצב לילה
        const toggleBtn = document.getElementById('toggleNight');
        toggleBtn.addEventListener('click', () => {
            if (typeof state !== 'undefined') {
                state.nightMode = !state.nightMode;
                localStorage.setItem('theme', state.nightMode ? 'night' : 'day');
                render(); 
            }
        });

        // טעינה ראשונית
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'night') {
                if (typeof state !== 'undefined') {
                    state.nightMode = true;
                    render();
                }
            }
        });
    </script>
</body>
</html>
