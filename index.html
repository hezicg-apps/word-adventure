<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Adventure Pro ⭐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background-color: #f0f9ff; transition: 0.3s; margin: 0; overflow-x: hidden; }
        .night-mode { background-color: #0f172a !important; color: #f1f5f9 !important; }
        
        /* Flashcards */
        .perspective-1000 { perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card-flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 2rem; border: 4px solid #bae6fd; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .card-back { transform: rotateY(180deg); background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
        .card-front { background: white; }

        /* Connect 4 - High End */
        .c4-container { background: #1e40af; padding: 15px; border-radius: 2rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); margin: 0 auto; width: fit-content; }
        .c4-board { display: grid; grid-template-columns: repeat(7, 60px); gap: 10px; background: #1e40af; }
        .c4-slot { width: 60px; height: 60px; background: #1e3a8a; border-radius: 50%; position: relative; box-shadow: inset 0 4px 8px rgba(0,0,0,0.4); overflow: hidden; }
        .token { width: 90%; height: 90%; border-radius: 50%; position: absolute; top: 5%; left: 5%; animation: dropToken 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .token-red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #b91c1c); border: 2px solid #7f1d1d; }
        .token-yellow { background: radial-gradient(circle at 30% 30%, #fbbf24, #d97706); border: 2px solid #78350f; }
        @keyframes dropToken { from { transform: translateY(-300px); } to { transform: translateY(0); } }
        
        .arrows-row { display: grid; grid-template-columns: repeat(7, 60px); gap: 10px; margin-bottom: 15px; }
        .arrow-btn { background: #3b82f6; color: white; border-radius: 12px; height: 40px; font-weight: bold; transition: 0.2s; }
        .arrow-btn:hover { background: #60a5fa; transform: translateY(-2px); }

        /* Word Quest */
        .word-cell { width: 50px; height: 50px; border: 3px solid #e2e8f0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; background: white; color: #1e293b; transition: 0.3s; }
        .correct { background: #22c55e !important; color: white; border-color: #16a34a; }
        .present { background: #eab308 !important; color: white; border-color: #ca8a04; }
        .absent { background: #94a3b8 !important; color: white; border-color: #64748b; }

        .night-mode .bg-white { background-color: #1e293b !important; color: white; }
        .night-mode .card-front { background-color: #1e293b !important; color: white; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">
    <header class="w-full max-w-lg flex justify-between items-center mb-8">
        <button onclick="toggleNight()" id="nBtn" class="text-3xl hover:scale-110 transition">☀️</button>
        <h1 class="text-3xl font-black text-blue-600 drop-shadow-sm">Word Adventure ⭐</h1>
        <div class="w-10"></div>
    </header>

    <main id="app" class="w-full max-w-lg"></main>

    <script>
        let state = {
            screen: 'welcome', inputText: 'apple - תפוח\nbanana - בננה\ncat - חתול\ndog - כלב', 
            words: [], nightMode: false, score: 0, 
            quiz: { idx: 0, correct: 0 },
            memory: { cards: [], flipped: [], pairs: 0, steps: 0, locked: false },
            c4: { board: Array(6).fill(0).map(()=>Array(7).fill(0)), turn: 1, isAi: true, canDrop: false, q: null },
            wq: { target: '', hint: '', guesses: [], current: '' },
            winner: null
        };

        function speak(t) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.9; window.speechSynthesis.speak(u); }
        function toggleNight() { state.nightMode = !state.nightMode; document.body.classList.toggle('night-mode', state.nightMode); document.getElementById('nBtn').innerText = state.nightMode?'🌙':'☀️'; }

        function render() {
            const app = document.getElementById('app'); app.innerHTML = '';
            if (state.winner) return renderWin(app);
            if (state.screen === 'welcome') renderWelcome(app);
            if (state.screen === 'input') renderInput(app);
            if (state.screen === 'flashcards') renderFlash(app);
            if (state.screen === 'quiz') renderQuiz(app);
            if (state.screen === 'menu') renderMenu(app);
            if (state.screen === 'memory') renderMem(app);
            if (state.screen === 'connect4') renderC4(app);
            if (state.screen === 'wordquest') renderWQ(app);
        }

        function renderWelcome(app) {
            app.innerHTML = `<div class="text-center space-y-8 animate-fade-in"><div class="bg-white p-10 rounded-[3rem] shadow-2xl border-b-8 border-blue-200"><h2 class="text-4xl font-black text-blue-600 mb-4">היי! הכל חזר 🎉</h2><p class="text-xl font-medium text-gray-500">העיצוב, האנימציות והמשחקים כאן.</p></div><button onclick="state.screen='input'; render()" class="w-full py-6 bg-blue-600 text-white rounded-full text-2xl font-black shadow-lg transform active:scale-95 transition">בואו נחזור לעניינים!</button></div>`;
        }

        function renderInput(app) {
            app.innerHTML = `<div class="space-y-4"><p class="text-2xl font-black text-blue-600 text-center">מה לומדים היום?</p><textarea id="ti" class="w-full h-64 p-6 rounded-[2rem] border-4 border-blue-100 text-right text-xl font-bold focus:border-blue-400 outline-none transition">${state.inputText}</textarea><button onclick="start()" class="w-full py-5 bg-blue-600 text-white rounded-full text-2xl font-black shadow-xl">המשך ללימוד 🚀</button></div>`;
            document.getElementById('ti').oninput = (e) => state.inputText = e.target.value;
        }

        function start() {
            const lines = state.inputText.split('\n').filter(l => l.includes('-'));
            state.words = lines.map(l => { const p = l.split('-'); return { e: p[0].trim(), h: p[1].trim(), ok: false, id: Math.random() }; });
            state.screen = 'flashcards'; render();
        }

        function renderFlash(app) {
            const unk = state.words.filter(w => !w.ok);
            if (!unk.length) { state.screen = 'quiz'; state.quiz.idx = 0; state.quiz.correct = 0; render(); return; }
            const cur = unk[0];
            app.innerHTML = `<div class="text-center space-y-6"><h2 class="text-2xl font-black">מילים שנשארו: ${unk.length}</h2><div onclick="this.classList.toggle('card-flipped')" class="h-80 perspective-1000 cursor-pointer w-full"><div class="card-inner"><div class="card-front flex-col text-5xl font-black text-blue-600">${cur.e}<button onclick="event.stopPropagation(); speak('${cur.e}')" class="mt-4 text-4xl">🔊</button></div><div class="card-back text-4xl font-black">${cur.h}</div></div></div><div class="grid grid-cols-2 gap-4"><button onclick="state.words.find(x=>x.id===${cur.id}).ok=true; render()" class="py-5 bg-green-500 text-white rounded-2xl font-black text-xl shadow-lg">יודע/ת ✅</button><button onclick="state.words.push(state.words.shift()); render()" class="py-5 bg-orange-500 text-white rounded-2xl font-black text-xl shadow-lg">עוד פעם 🔄</button></div></div>`;
        }

        function renderQuiz(app) {
            if (state.quiz.idx >= state.words.length) { state.score = (state.quiz.correct/state.words.length)*100; confetti(); state.screen='menu'; render(); return; }
            const cur = state.words[state.quiz.idx];
            const opts = [...new Set([cur.h, ...state.words.map(w=>w.h)])].sort(()=>Math.random()-0.5).slice(0,4);
            app.innerHTML = `<div class="text-center space-y-6"><h2 class="text-2xl font-black">מבחן ⭐ ${state.quiz.idx+1}/${state.words.length}</h2><div class="bg-white p-8 rounded-[2.5rem] shadow-xl border-4 border-blue-400"><p class="text-4xl font-black mb-8">${cur.e}</p><div class="grid gap-4">${opts.map(o => `<button onclick="checkQ('${o}','${cur.h}')" class="py-4 border-2 rounded-2xl font-bold text-xl hover:bg-blue-50 transition">${o}</button>`).join('')}</div></div></div>`;
        }
        function checkQ(s,c) { if(s===c) state.quiz.correct++; state.quiz.idx++; render(); }

        function renderMenu(app) {
            const lock = state.score < 70;
            app.innerHTML = `<div class="text-center space-y-4"><div class="bg-white p-6 rounded-[2rem] shadow-xl mb-6"><h2 class="text-3xl font-black text-blue-600">כל הכבוד!</h2><p class="text-xl font-bold">הציון שלך: ${state.score.toFixed(0)}%</p></div><div class="grid gap-4"><button onclick="${lock?'':'startMem()'}" class="p-6 bg-purple-600 text-white rounded-2xl text-2xl font-black shadow-lg ${lock?'opacity-50':''}">משחק זיכרון 🧠</button><button onclick="${lock?'':'startC4()'}" class="p-6 bg-blue-600 text-white rounded-2xl text-2xl font-black shadow-lg ${lock?'opacity-50':''}">4 בשורה נגד המחשב 🤖</button><button onclick="${lock?'':'startWQ()'}" class="p-6 bg-emerald-600 text-white rounded-2xl text-2xl font-black shadow-lg ${lock?'opacity-50':''}">הקוד הסודי 🔐</button></div><button onclick="state.screen='input';render()" class="text-gray-400 underline mt-4">הזנת מילים חדשות</button></div>`;
        }

        // --- Memory ---
        function startMem() {
            state.screen = 'memory';
            let cards = []; state.words.slice(0,8).forEach(w => { cards.push({t:w.e, m:w.h, v:w.e}, {t:w.h, m:w.e, v:w.e}); });
            state.memory = { cards: cards.sort(()=>Math.random()-0.5).map((c,i)=>({...c, id:i, f:false, ok:false})), flipped:[], pairs:0, steps:0 };
            render();
        }
        function renderMem(app) {
            const m = state.memory;
            app.innerHTML = `<div class="flex flex-col items-center"><div class="flex justify-between w-full mb-6 font-bold bg-white p-4 rounded-2xl shadow"><button onclick="state.screen='menu';render()">❌ סגור</button><span>צעדים: ${m.steps}</span><span>זוגות: ${m.pairs}</span></div><div class="grid grid-cols-4 gap-3 w-full">${m.cards.map(c => `<div onclick="flip(${c.id})" class="relative aspect-square perspective-1000 cursor-pointer ${c.f||c.ok?'card-flipped':''}"><div class="card-inner"><div class="card-front bg-purple-600 text-white text-3xl font-bold shadow-md">?</div><div class="card-back bg-white text-black text-[10px] font-bold border-2 ${c.ok?'border-green-500 bg-green-50':''}">${c.t}</div></div></div>`).join('')}</div></div>`;
        }
        function flip(id) {
            const m = state.memory; if(m.locked || m.flipped.length==2) return;
            const c = m.cards.find(x=>x.id==id); if(c.f||c.ok) return;
            c.f = true; m.flipped.push(c); render();
            if(m.flipped.length==2) {
                m.steps++; m.locked = true;
                const [c1,c2] = m.flipped;
                if(c1.t==c2.m || c2.t==c1.m) {
                    setTimeout(()=>{ c1.ok=c2.ok=true; m.pairs++; m.flipped=[]; m.locked=false; speak(c1.v); if(m.pairs==m.cards.length/2){ confetti(); state.winner={msg:'אלופים!'}; } render(); }, 600);
                } else { setTimeout(()=>{ c1.f=c2.f=false; m.flipped=[]; m.locked=false; render(); }, 1200); }
            }
        }

        // --- Connect 4 (Beautiful) ---
        function startC4() {
            state.screen='connect4';
            state.c4 = { board: Array(6).fill(0).map(()=>Array(7).fill(0)), turn:1, canDrop:false, q:getQ() };
            render();
        }
        function getQ() {
            const w = state.words[Math.floor(Math.random()*state.words.length)];
            return { p:w.e, c:w.h, opts: [w.h, ...state.words.filter(x=>x.h!=w.h).map(x=>x.h)].sort(()=>Math.random()-0.5).slice(0,4) };
        }
        function renderC4(app) {
            const c = state.c4;
            app.innerHTML = `<div class="flex flex-col items-center animate-fade-in"><div class="mb-4 bg-white p-3 rounded-xl shadow-lg font-bold">תור: ${c.turn==1?'🔴 אדום (אתה)':'🟡 צהוב (מחשב)'}</div><div class="c4-container"><div class="arrows-row">${[0,1,2,3,4,5,6].map(i=>`<button onclick="dropC4(${i})" class="arrow-btn">↓</button>`).join('')}</div><div class="c4-board">${c.board.map(r=>r.map(s=>`<div class="c4-slot">${s?`<div class="token ${s==1?'token-red':'token-yellow'}"></div>`:''}</div>`).join('')).join('')}</div></div>
            ${!c.canDrop && c.turn==1 ? `<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50"><div class="bg-white p-8 rounded-[2.5rem] w-full max-w-xs text-center shadow-2xl"><p class="text-sm text-blue-500 font-bold mb-2">ענה נכון כדי לשחק</p><h3 class="text-3xl font-black mb-6">${c.q.p}</h3><div class="grid gap-3">${c.q.opts.map(o=>`<button onclick="ansC4('${o}')" class="p-4 border-2 border-blue-100 rounded-2xl font-bold text-lg hover:border-blue-500 transition">${o}</button>`).join('')}</div></div></div>` : ''}</div>`;
        }
        function ansC4(o) { if(o==state.c4.q.c) { state.c4.canDrop=true; render(); } else { state.c4.turn=2; setTimeout(aiMove, 800); render(); } }
        function dropC4(col) {
            if(!state.c4.canDrop || state.c4.turn!=1) return;
            const b = state.c4.board;
            for(let r=5; r>=0; r--) { if(b[r][col]==0) { b[r][col]=1; break; } }
            state.c4.canDrop=false; state.c4.turn=2; render();
            setTimeout(aiMove, 1000);
        }
        function aiMove() {
            const b = state.c4.board; const cols = [0,1,2,3,4,5,6].filter(i=>!b[0][i]);
            if(cols.length) {
                const c = cols[Math.floor(Math.random()*cols.length)];
                for(let r=5;r>=0;r--) { if(b[r][c]==0) { b[r][c]=2; break; } }
            }
            state.c4.turn=1; state.c4.q=getQ(); render();
        }

        // --- Word Quest ---
        function startWQ() {
            const w = state.words[Math.floor(Math.random()*state.words.length)];
            state.wq = { target: w.e.toLowerCase(), hint: w.h, guesses: [], current: '' };
            state.screen='wordquest'; render();
        }
        function renderWQ(app) {
            const w = state.wq;
            app.innerHTML = `<div class="flex flex-col items-center"><div class="bg-blue-600 text-white p-4 rounded-2xl shadow-lg mb-6 w-full text-center font-bold text-xl">רמז: ${w.hint}</div><div class="grid gap-2 mb-8">${Array(5).fill().map((_,i)=>`<div class="flex gap-2">${Array(w.target.length).fill().map((_,j)=>`<div class="word-cell ${getWS(i,j)}">${w.guesses[i]?w.guesses[i][j]:(i==w.guesses.length?w.current[j]||'':'')}</div>`).join('')}</div>`).join('')}</div><div class="w-full max-w-sm"><input type="text" id="wqi" maxlength="${w.target.length}" class="w-full p-4 rounded-xl border-2 text-center text-2xl font-black uppercase tracking-widest outline-none focus:border-blue-500" placeholder="הקלד כאן..."><button onclick="subWQ()" class="w-full mt-4 py-4 bg-blue-600 text-white rounded-xl font-bold text-xl shadow-lg">שלח ניחוש (Enter)</button></div></div>`;
            const inp = document.getElementById('wqi'); inp.focus();
            inp.oninput = (e) => { state.wq.current = e.target.value.toLowerCase(); render(); document.getElementById('wqi').focus(); };
            inp.onkeydown = (e) => { if(e.key=='Enter') subWQ(); }
        }
        function subWQ() {
            const w = state.wq; if(w.current.length != w.target.length) return;
            w.guesses.push(w.current); if(w.current == w.target) { confetti(); state.winner={msg:'פיצחת את הקוד!'}; }
            w.current = ''; render();
        }
        function getWS(r,j) {
            const w = state.wq; if(!w.guesses[r]) return '';
            const c = w.guesses[r][j]; if(c==w.target[j]) return 'correct';
            if(w.target.includes(c)) return 'present'; return 'absent';
        }

        function renderWin(app) {
            app.innerHTML = `<div class="text-center mt-20 animate-fade-in"><h2 class="text-6xl font-black text-blue-600 mb-8">${state.winner.msg}</h2><button onclick="state.winner=null; state.screen='menu'; render()" class="px-12 py-5 bg-blue-600 text-white rounded-full text-2xl font-bold shadow-2xl transform hover:scale-105 transition">חזרה לתפריט</button></div>`;
        }

        render();
    </script>
</body>
</html>
