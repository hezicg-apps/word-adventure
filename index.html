<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Adventure - Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; background: #f8fafc; transition: 0.3s; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; position: relative; width: 100%; height: 100%; }
        .card-flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-back { transform: rotateY(180deg); background: #2563eb; color: white; }
        .eng-font { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .grid-bg { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="grid-bg min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-md flex justify-between items-center py-4 mb-2">
        <div class="text-2xl font-black text-blue-600 tracking-tighter">WORD ADVENTURE</div>
        <button onclick="state.screen='input'; render()" class="bg-white p-2 rounded-full shadow-sm text-sm font-bold border">🔄 החלף רשימה</button>
    </header>

    <div id="app" class="w-full max-w-md"></div>

    <script>
        let state = {
            screen: 'welcome',
            words: [],
            listName: 'אוצר המילים שלי',
            currentIdx: 0,
            score: 0,
            memory: { cards: [], flipped: [], pairs: 0, lock: false },
            c4: { board: Array(6).fill(null).map(() => Array(7).fill(null)), turn: 1, q: null }
        };

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            switch(state.screen) {
                case 'welcome': renderWelcome(app); break;
                case 'input': renderInput(app); break;
                case 'menu': renderMenu(app); break;
                case 'flashcards': renderFlashcards(app); break;
                case 'quiz': renderQuiz(app); break;
                case 'memory': renderMemory(app); break;
                case 'c4': renderC4(app); break;
            }
        }

        function renderWelcome(app) {
            app.innerHTML = `
                <div class="bg-white p-10 rounded-[3rem] shadow-2xl text-center border-4 border-blue-50">
                    <div class="text-7xl mb-6">🏜️</div>
                    <h2 class="text-3xl font-black text-gray-800 mb-2">מוכנים למסע?</h2>
                    <p class="text-gray-500 font-bold mb-8">בואו נלמד אנגלית בדרך אחרת</p>
                    <button onclick="state.screen='input'; render()" class="w-full py-5 bg-blue-600 text-white rounded-2xl text-2xl font-black shadow-lg">מתחילים 🚀</button>
                </div>`;
        }

        function renderInput(app) {
            app.innerHTML = `
                <div class="bg-white p-8 rounded-[2.5rem] shadow-xl space-y-4 border-b-8 border-blue-100">
                    <label class="block font-black text-gray-700">שם היחידה:</label>
                    <input type="text" id="ln" value="${state.listName}" class="w-full p-4 rounded-xl border-2 bg-gray-50 outline-none focus:border-blue-400">
                    <label class="block font-black text-gray-700">המילים (מילה - תרגום):</label>
                    <textarea id="wi" class="w-full h-48 p-4 rounded-xl border-2 bg-gray-50 outline-none focus:border-blue-400 text-right" placeholder="מילה - תרגום"></textarea>
                    <button onclick="process()" class="w-full py-5 bg-green-500 text-white rounded-2xl text-2xl font-black shadow-lg">צור את הקסם ✨</button>
                </div>`;
        }

        function process() {
            const val = document.getElementById('wi').value;
            const lines = val.split('\n').filter(l => l.includes('-'));
            if(lines.length < 2) return alert('הזן לפחות 2 מילים בפורמט: מילה - תרגום');
            state.listName = document.getElementById('ln').value || 'אוצר המילים שלי';
            state.words = lines.map(l => {
                const [e, h] = l.split('-').map(s => s.trim());
                return { eng: e, heb: h };
            });
            state.screen = 'menu';
            render();
        }

        function renderMenu(app) {
            app.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-6 rounded-3xl shadow-md text-center">
                        <h2 class="text-2xl font-black text-gray-800">${state.listName}</h2>
                        <div class="flex justify-center gap-2 mt-2">
                            <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm font-bold">${state.words.length} מילים</span>
                        </div>
                    </div>
                    <div class="grid gap-4">
                        <button onclick="state.screen='flashcards'; state.currentIdx=0; render()" class="group relative p-6 bg-white rounded-3xl shadow-md hover:shadow-xl transition border-r-8 border-orange-400">
                            <div class="text-right">
                                <div class="text-2xl font-black text-gray-800">כרטיסיות חכמות</div>
                                <div class="text-gray-500">לימוד ושינון עם קריינות</div>
                            </div>
                            <span class="absolute left-6 top-6 text-3xl">🗂️</span>
                        </button>
                        <button onclick="state.screen='quiz'; state.currentIdx=0; state.score=0; render()" class="group relative p-6 bg-white rounded-3xl shadow-md hover:shadow-xl transition border-r-8 border-blue-500">
                            <div class="text-right">
                                <div class="text-2xl font-black text-gray-800">מבחן אלוף</div>
                                <div class="text-gray-500">בדוק את עצמך תחת לחץ</div>
                            </div>
                            <span class="absolute left-6 top-6 text-3xl">📝</span>
                        </button>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="startMemory()" class="p-6 bg-purple-600 text-white rounded-3xl font-black text-xl shadow-lg">זיכרון 🧠</button>
                            <button onclick="startC4()" class="p-6 bg-red-500 text-white rounded-3xl font-black text-xl shadow-lg">4 בשורה 🔴</button>
                        </div>
                    </div>
                </div>`;
        }

        function renderFlashcards(app) {
            const word = state.words[state.currentIdx];
            app.innerHTML = `
                <div class="flex flex-col items-center space-y-6">
                    <div class="w-full h-80 perspective-1000" onclick="this.classList.toggle('card-flipped')">
                        <div class="card-inner shadow-2xl">
                            <div class="card-front bg-white border-4 border-blue-50">
                                <span class="text-5xl font-black text-blue-600 eng-font">${word.eng}</span>
                                <button onclick="event.stopPropagation(); speak('${word.eng}')" class="mt-6 bg-gray-100 p-3 rounded-full text-2xl">🔊</button>
                                <p class="mt-8 text-gray-300 font-bold">לחצו להפיכה</p>
                            </div>
                            <div class="card-back">
                                <span class="text-5xl font-black">${word.heb}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-4 w-full">
                        <button onclick="state.currentIdx = (state.currentIdx + 1) % state.words.length; render()" class="flex-1 py-5 bg-blue-600 text-white rounded-2xl font-black text-xl">המילה הבאה ➡️</button>
                        <button onclick="state.screen='menu'; render()" class="px-8 py-5 bg-gray-800 text-white rounded-2xl font-black">בית</button>
                    </div>
                </div>`;
        }

        function renderQuiz(app) {
            const word = state.words[state.currentIdx];
            if(!word) {
                app.innerHTML = `<div class="bg-white p-10 rounded-3xl shadow-xl text-center"><h2 class="text-4xl font-black mb-4">אלופים! 🏆</h2><p class="text-2xl mb-8">הציון שלכם: ${Math.round((state.score/state.words.length)*100)}%</p><button onclick="state.screen='menu'; render()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black">חזרה לתפריט</button></div>`;
                return;
            }
            let opts = [word.heb, ...state.words.filter(w => w.heb !== word.heb).map(w => w.heb).sort(() => 0.5-Math.random()).slice(0, 3)].sort(() => 0.5-Math.random());
            app.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-xl border-t-8 border-blue-500">
                    <div class="text-center mb-8">
                        <div class="text-gray-400 font-bold mb-2">שאלה ${state.currentIdx + 1} מתוך ${state.words.length}</div>
                        <div class="text-5xl font-black text-blue-600 eng-font">${word.eng}</div>
                    </div>
                    <div class="grid gap-3">
                        ${opts.map(o => `<button onclick="checkQuiz('${o}','${word.heb}')" class="py-4 border-2 border-gray-100 rounded-2xl font-black text-lg hover:bg-blue-50 transition">${o}</button>`).join('')}
                    </div>
                </div>`;
        }

        function checkQuiz(s, c) {
            if(s === c) { state.score++; confetti(); }
            state.currentIdx++; render();
        }

        function startMemory() {
            let cards = [];
            const pool = [...state.words].sort(() => 0.5 - Math.random()).slice(0, 6);
            pool.forEach(w => {
                cards.push({ v: w.eng, p: w.heb, f: false, m: false });
                cards.push({ v: w.heb, p: w.eng, f: false, m: false });
            });
            state.memory = { cards: cards.sort(() => 0.5 - Math.random()), flipped: [], pairs: 0, lock: false };
            state.screen = 'memory'; render();
        }

        function renderMemory(app) {
            app.innerHTML = `
                <div class="bg-white p-4 rounded-3xl shadow-lg mb-4 flex justify-between items-center">
                    <span class="font-black text-purple-600">זוגות: ${state.memory.pairs}/6</span>
                    <button onclick="state.screen='menu'; render()" class="font-bold text-gray-400">יציאה</button>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    ${state.memory.cards.map((c, i) => `
                        <div onclick="moveMem(${i})" class="h-28 rounded-2xl flex items-center justify-center cursor-pointer transition shadow-md border-b-4 ${c.m ? 'opacity-0' : (c.f ? 'bg-white border-purple-500' : 'bg-purple-600 border-purple-800')}">
                            <span class="font-bold text-center p-1 text-xs ${c.f ? '' : 'hidden'}">${c.v}</span>
                        </div>`).join('')}
                </div>`;
        }

        function moveMem(i) {
            const m = state.memory; if(m.lock || m.cards[i].f || m.cards[i].m) return;
            m.cards[i].f = true; m.flipped.push(i); render();
            if(m.flipped.length === 2) {
                m.lock = true; const [a, b] = m.flipped;
                if(m.cards[a].v === m.cards[b].p || m.cards[b].v === m.cards[a].p) {
                    setTimeout(() => { m.cards[a].m = m.cards[b].m = true; m.pairs++; m.flipped = []; m.lock = false; if(m.pairs===6){ confetti(); alert('פנומנלי!'); state.screen='menu'; } render(); }, 600);
                } else {
                    setTimeout(() => { m.cards[a].f = m.cards[b].f = false; m.flipped = []; m.lock = false; render(); }, 1000);
                }
            }
        }

        function startC4() {
            state.c4 = { board: Array(6).fill(null).map(() => Array(7).fill(null)), turn: 1, q: null };
            state.screen = 'c4'; render();
        }

        function renderC4(app) {
            const c = state.c4;
            app.innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="w-full bg-white p-4 rounded-2xl shadow mb-4 flex justify-between items-center">
                        <span class="font-black ${c.turn===1?'text-red-500':'text-yellow-500'}">${c.turn===1?'תור אדום 🔴':'תור צהוב 🟡'}</span>
                        <button onclick="state.screen='menu'; render()" class="text-gray-400 font-bold">סגור</button>
                    </div>
                    <div class="bg-blue-700 p-2 rounded-2xl grid grid-cols-7 gap-1 shadow-2xl border-b-8 border-blue-900">
                        ${c.board.map((row, r) => row.map((cell, col) => `
                            <div onclick="clickC4(${col})" class="w-10 h-10 sm:w-12 sm:h-12 bg-blue-50 rounded-full flex items-center justify-center shadow-inner">
                                ${cell === 1 ? '<div class="w-8 h-8 sm:w-10 sm:h-10 bg-red-500 rounded-full shadow-lg"></div>' : cell === 2 ? '<div class="w-8 h-8 sm:w-10 sm:h-10 bg-yellow-400 rounded-full shadow-lg"></div>' : ''}
                            </div>`).join('')).join('')}
                    </div>
                    ${c.q ? `<div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 animate-fade-in">
                        <div class="bg-white p-8 rounded-[2rem] w-full max-w-xs text-center shadow-2xl">
                            <h3 class="text-4xl font-black text-blue-600 mb-6 eng-font">${c.q.eng}</h3>
                            <div class="grid gap-3">${c.q.opts.map(o => `<button onclick="checkC4('${o}')" class="py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl font-bold text-lg hover:bg-blue-50 transition">${o}</button>`).join('')}</div>
                        </div>
                    </div>` : ''}
                </div>`;
        }

        function clickC4(col) {
            if(state.c4.board[0][col]) return;
            const word = state.words[Math.floor(Math.random() * state.words.length)];
            let opts = [word.heb, ...state.words.filter(w => w.heb !== word.heb).map(w => w.heb).sort(() => 0.5-Math.random()).slice(0, 2)].sort(() => 0.5-Math.random());
            state.c4.q = { ...word, opts, col }; render();
        }

        function checkC4(ans) {
            const c = state.c4;
            if(ans === c.q.heb) {
                for(let r=5; r>=0; r--) {
                    if(!c.board[r][c.q.col]) { c.board[r][c.q.col] = c.turn; break; }
                }
                c.turn = c.turn === 1 ? 2 : 1;
            } else { alert('טעות! התור עובר.'); c.turn = c.turn === 1 ? 2 : 1; }
            c.q = null; render();
        }

        function speak(t) {
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(t);
            m.lang = 'en-US';
            window.speechSynthesis.speak(m);
        }

        // טעינה אוטומטית מהקישור
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const shared = params.get('w');
            if(shared) {
                try {
                    const decoded = decodeURIComponent(escape(atob(shared)));
                    const lines = decoded.split('\n');
                    state.listName = lines[0].includes('-') ? 'אוצר מילים' : lines[0];
                    state.words = lines.filter(l => l.includes('-')).map(l => {
                        const [e, h] = l.split('-').map(s => s.trim());
                        return { eng: e, heb: h };
                    });
                    state.screen = 'menu';
                } catch(e) { state.screen = 'welcome'; }
            }
            render();
        };
    </script>
</body>
</html>
