<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; transition: background-color 0.5s; }
        .night-mode { background-color: #1a202c !important; color: white; }
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col font-sans">

    <header class="w-full p-4 flex justify-between items-center max-w-4xl mx-auto">
        <div id="header-logo-container" class="w-12 h-12 flex items-center justify-center"></div>
        <div id="header-title-container" class="flex-grow text-center">
            <h1 id="header-title" class="text-3xl font-black transition-all drop-shadow-md">Word Adventure</h1>
        </div>
        <button id="toggleNight" class="p-3 bg-white/80 backdrop-blur rounded-full shadow-lg text-2xl active:scale-90 transition-all">
            ☀️
        </button>
    </header>

    <main id="app" class="flex-grow flex flex-col items-center justify-start p-4 w-full max-w-4xl mx-auto">
        </main>

    <script src="js/main.js"></script>
</body>
</html>
