<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>WordMaster AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Assistant', sans-serif; 
            background: #f0f7ff; 
            transition: background 0.3s; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
        }
        .night-mode { background: #1a1a1a !important; color: #e0e0e0; }
        .eng-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: ltr; }
        #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
        
        /* עיצוב כרטיסיות */
        .perspective-1000 { perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 2rem; }
        .card-back { transform: rotateY(180deg); }

        /* עיצוב 4 בשורה */
        .c4-board { display: grid; grid-template-columns: repeat(7, 1fr); background: #2563eb; padding: 8px; border-radius: 1rem; gap: 6px; }
        .c4-slot { width: 40px; height: 40px; background: #1e40af; border-radius: 50%; position: relative; }
        .token-fixed { position: absolute; inset: 2px; border-radius: 50%; }
        .token-red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000); }
        .token-yellow { background: radial-gradient(circle at 30% 30%, #fff066, #ccac00); }
        .c4-container { background: #1e3a8a; padding: 15px; border-radius: 1.5rem; border: 4px solid #3b82f6; }

        .correct-ans { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .wrong-ans { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <button id="toggleNight" class="fixed top-4 right-4 z-[100] p-3 rounded-full bg-white/80 shadow-lg text-xl">☀️</button>
    
    <div id="app"></div>

    <script src="main.js"></script>
</body>
</html>
