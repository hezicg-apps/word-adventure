<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Word Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 p-4 flex flex-col items-center font-sans">
    <h1 class="text-2xl font-black text-blue-600 mb-6">Word Adventure</h1>
    <div id="app" class="w-full max-w-md"></div>

    <script>
        let words = [];
        let screen = 'input';

        function render() {
            const app = document.getElementById('app');
            if (screen === 'input') {
                app.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-lg">
                        <textarea id="win" class="w-full h-32 border p-2 mb-4 text-right" placeholder="מילה - תרגום"></textarea>
                        <button onclick="save()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">התחל ללמוד</button>
                    </div>`;
            } else {
                app.innerHTML = `
                    <div class="bg-white p-10 rounded-2xl shadow-lg text-center">
                        <h2 class="text-3xl font-bold mb-4">${words[0].eng}</h2>
                        <button onclick="alert(words[0].heb)" class="bg-green-500 text-white p-4 rounded-xl w-full">הצג תרגום</button>
                        <button onclick="location.reload()" class="mt-4 text-gray-400">חזור</button>
                    </div>`;
            }
        }

        function save() {
            const val = document.getElementById('win').value;
            if(!val.includes('-')) return alert('צריך סימן - בין המילה לתרגום');
            words = val.split('\n').map(l => {
                const [e, h] = l.split('-');
                return {eng: e.trim(), heb: h.trim()};
            });
            screen = 'learn';
            render();
        }

        render();
    </script>
</body>
</html>
