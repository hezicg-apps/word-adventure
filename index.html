<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Learning Adventure</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        .dot { animation: glow 1.5s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.5s; }
        .dot:nth-child(3) { animation-delay: 1s; }
        @keyframes glow { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        
        /* עיצוב לוגו מצד שמאל */
        #game-branding img {
            max-height: 50px;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col items-center bg-slate-50 transition-colors duration-300">

    <header class="w-full max-w-md flex justify-between items-center mb-6 py-2">
        <button id="toggleNight" class="text-3xl bg-transparent p-3 rounded-full hover:scale-110 transition-transform outline-none border-none shadow-none">☀️</button>
        
        <div id="game-branding" class="flex items-center">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span style="display:none;" class="text-2xl font-black text-blue-600">WORD ADVENTURE</span>
        </div>
    </header>

    <main id="app" class="w-full max-w-md"></main>

    <div id="loading-screen" class="flex flex-col items-center justify-center mt-20">
        <div class="flex gap-2 mb-4">
            <div class="dot w-4 h-4 bg-blue-600 rounded-full"></div>
            <div class="dot w-4 h-4 bg-blue-500 rounded-full"></div>
            <div class="dot w-4 h-4 bg-blue-400 rounded-full"></div>
        </div>
        <p class="font-black text-blue-600">טוען...</p>
    </div>

    <script src="main.js"></script>

    <script>
        window.addEventListener('load', () => {
            if (typeof render === 'function') {
                const loading = document.getElementById('loading-screen');
                if (loading) loading.style.display = 'none';
                render(); 
            }
        });
    </script>
</body>
</html>
